<!doctype html>
<!-- sandbox: the page that runs the model's code. slop loads it in a hidden iframe with
     sandbox="allow-scripts" (an opaque origin: no cookies, no storage, no access to slop's page).
     Its own policy allows no network at all. It has to be its own file: an inline (srcdoc)
     frame would take slop's policy instead. See runner.js; helpers.js holds what the code can use. -->
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src blob:; base-uri 'none'; form-action 'none'">
  <script src="helpers.js"></script>
  <script src="runner.js"></script>
</head>
</html>
