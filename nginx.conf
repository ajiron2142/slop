# The site config for the nginx-unprivileged image (port 8080, runs without root, so it
# works on OpenShift). Replaces the image's /etc/nginx/conf.d/default.conf.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Scripts and stylesheets shrink to about a quarter of their size over the wire.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # The app's files keep the same names between releases, so the browser re-checks them on
    # each load (a quick "not modified" when nothing changed) and never mixes old and new files.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # The page can't be embedded in another site (the in-page policy can't set this).
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # Font files never change, so browsers keep them for a month.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
