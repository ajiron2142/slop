<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- sandbox: frame-src 'self' lets the sandbox iframe load (sandbox/sandbox.html) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https:; frame-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Chat</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components/sidebar.css">
  <link rel="stylesheet" href="styles/components/messages.css">
  <link rel="stylesheet" href="styles/components/composer.css">
  <link rel="stylesheet" href="styles/components/picker.css">
  <link rel="stylesheet" href="styles/components/settings.css">
  <link rel="stylesheet" href="styles/components/meter.css">
  <link rel="stylesheet" href="styles/components/panel.css">
  <link rel="stylesheet" href="styles/components/folder-git.css">
  <link rel="stylesheet" href="styles/components/mini.css">
  <link rel="stylesheet" href="styles/components/viewer.css">
  <link rel="stylesheet" href="styles/components/gitlab.css">
  <link rel="stylesheet" href="styles/components/patch.css">
  <link rel="stylesheet" href="styles/components/activity.css">
  <link rel="stylesheet" href="styles/components/flow.css">
  <link rel="stylesheet" href="styles/components/sandbox.css"><!-- sandbox -->
  <!-- Themes: one line each. Add a theme by adding its file and a line here.
       media="not all" lets them download without delaying the first paint; the chosen one is switched on. -->
  <link rel="stylesheet" href="styles/themes/monokai.css" media="not all" data-theme="monokai" data-name="Monokai">
  <link rel="stylesheet" href="styles/themes/linen.css" media="not all" data-theme="linen" data-name="Linen">
  <link rel="stylesheet" href="styles/themes/bauhaus.css" media="not all" data-theme="bauhaus" data-name="Bauhaus">
  <script type="module" src="app/main.js"></script>
  <!-- Optional speed-up: fetch every module at once instead of one import level at a time.
       Add new app files here too; a missing line only costs a little speed. -->
  <link rel="modulepreload" href="app/api.js">
  <link rel="modulepreload" href="app/storage.js">
  <link rel="modulepreload" href="app/dom.js">
  <link rel="modulepreload" href="app/theme.js">
  <link rel="modulepreload" href="app/folder.js">
  <link rel="modulepreload" href="app/stats.js">
  <link rel="modulepreload" href="app/markdown.js">
  <link rel="modulepreload" href="app/highlight.js">
  <link rel="modulepreload" href="app/components/sidebar.js">
  <link rel="modulepreload" href="app/components/messages.js">
  <link rel="modulepreload" href="app/components/composer.js">
  <link rel="modulepreload" href="app/components/picker.js">
  <link rel="modulepreload" href="app/components/settings.js">
  <link rel="modulepreload" href="app/components/meter.js">
  <link rel="modulepreload" href="app/components/panel.js">
  <link rel="modulepreload" href="app/folder-git.js">
  <link rel="modulepreload" href="app/diff.js">
  <link rel="modulepreload" href="app/paste.js">
  <link rel="modulepreload" href="app/lines.js">
  <link rel="modulepreload" href="app/copy.js">
  <link rel="modulepreload" href="app/mini.js">
  <link rel="modulepreload" href="app/viewer.js">
  <link rel="modulepreload" href="app/oidc.js">
  <link rel="modulepreload" href="app/autotitle.js">
  <link rel="modulepreload" href="app/gitlab.js">
  <link rel="modulepreload" href="app/patch.js">
  <link rel="modulepreload" href="app/activity.js">
  <link rel="modulepreload" href="app/flow.js">
  <link rel="modulepreload" href="app/sandbox.js"><!-- sandbox -->
  <link rel="modulepreload" href="vendor/marked.esm.js">
  <link rel="modulepreload" href="vendor/purify.es.js">
  <link rel="modulepreload" href="vendor/idb-keyval.js">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar themed" aria-label="Chats">
      <div class="sidebar-top">
        <button id="collapse-btn" class="icon-btn collapse-btn" aria-label="Collapse sidebar" aria-expanded="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <button id="new-chat" class="btn primary" aria-label="New chat"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="label">New chat</span></button>
      </div>
      <input id="search" class="search" type="search" placeholder="Search chats" aria-label="Search chats">
      <ul id="chat-list" class="chat-list"></ul>
      <button id="settings-btn" class="btn settings-btn" aria-label="Settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="label">Settings</span></button>
    </aside>
    <div class="scrim" id="scrim"></div>

    <section class="chat themed" id="chat">
      <header class="chat-header">
        <button id="menu-btn" class="icon-btn menu-btn" aria-label="Show chats"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1 class="chat-title">Chat</h1>
        <!-- The usage meter sits with the model it describes. -->
        <div id="meter-row" class="meter-row" hidden>
          <div class="meter-anchor">
            <div id="meter-pop" class="meter-pop" role="dialog" aria-label="Usage for this chat" hidden></div>
            <button type="button" id="meter-btn" class="meter" aria-expanded="false" aria-controls="meter-pop" aria-label="Usage for this chat"></button>
          </div>
        </div>
        <div class="picker" id="model-picker"></div>
        <button id="mini-btn" class="icon-btn mini-btn" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/><path d="M10 17l5-5"/><path d="M11 12h4v4"/></svg></button>
      </header>
      <p id="notice" class="notice" role="status" hidden></p>
      <div id="messages" class="messages"></div>
      <div id="tray" class="tray" hidden></div>
      <form id="composer" class="composer">
        <button type="button" id="attach-btn" class="icon-btn attach" aria-label="Attach images or text files"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <input type="file" id="file-input" multiple hidden>
        <textarea id="input" rows="1" placeholder="Write a message…" aria-label="Message"></textarea>
        <button type="submit" id="send-btn" class="send" aria-label="Send">Send</button>
      </form>
      <div id="drop" class="drop" hidden>Drop images or text files to attach</div>
      <div id="attach-menu" class="attach-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-action="files"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>Attach files</button>
        <button type="button" role="menuitem" data-action="folder"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Connect folder (read-only)</button>
        <button type="button" role="menuitem" data-action="gitlab" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21l-9-7 3-10 3 7h6l3-7 3 10z"/></svg>Connect GitLab project…</button><!-- gitlab -->
        <button type="button" role="menuitemcheckbox" aria-checked="false" data-action="sandbox"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14v11H5z"/><path d="M4 6h16v3H4z"/><path d="M10 13h4"/></svg>Sandbox</button><!-- sandbox -->
      </div>
    </section>
    <aside id="panel" class="panel themed" aria-label="Side panel" hidden></aside>
  </div>

  <dialog id="settings" class="settings themed">
    <button id="close-settings" class="icon-btn settings-close" aria-label="Close settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2>Settings</h2>
    <label>LiteLLM base URL
      <input id="set-base-url" type="url" autofocus placeholder="https://litellm.example.com" autocomplete="off" spellcheck="false">
    </label>
    <div id="signin" class="signin" hidden></div><!-- sign-in: filled by app/oidc.js when config.json sets it up -->
    <label>API key
      <input id="set-api-key" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
    </label>
    <label>System prompt (optional)
      <textarea id="set-system" rows="3"></textarea>
    </label>
    <div id="gitlab-settings" class="gitlab-settings"></div><!-- gitlab: filled by app/gitlab.js -->
    <div class="field">Theme <div class="picker block" id="theme-picker"></div></div>
    <label class="check"><input type="checkbox" id="set-stats"> Show detailed stats <span>Adds a Stats button to each reply, and a per-model breakdown to the usage meter.</span></label>
    <p id="settings-status" class="settings-status" role="status"></p>
    <div class="row">
      <button id="save-settings" class="btn primary">Save</button>
      <button id="test-conn" class="btn">Test connection</button>
    </div>
    <div class="row">
      <button id="export-btn" class="btn">Export chats</button>
      <button id="import-btn" class="btn">Import chats</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
    <div class="row">
      <button id="forget-key" class="btn">Forget key</button>
      <button id="delete-all" class="btn danger">Delete all local data</button>
    </div>
    <p class="hint">Your key and chats are stored only in this browser. Requests go only to the base URL above.</p>
  </dialog>
  <script src="app/boot.js"></script>
</body>
</html>
